[package]
name = "monitorthesituation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A polished multi-feed ASCII video wall for your terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/maddiedreese/monitorthesituation"
keywords = ["terminal", "ascii", "video", "webcam", "tui"]
categories = ["command-line-utilities", "multimedia::video"]
exclude = ["/work/**"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
